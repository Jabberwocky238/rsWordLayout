[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/gpu",
  "crates/svg",
  "crates/wasm",
  "crates/cffi",
  "crates/vulkan",
  "crates/opengl",
  "crates/webgl",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rsword = { git = "https://github.com/LilLeapo/rsWordParser.git", rev = "399e36a3c645e9b9001531fb06969f8ce5347e1f" }
# 字体环境与布局契约来自 docx-layout（MIT OR Apache-2.0）：
# 它的 fontenv 用 skrifa 读 OpenType，提供按码位的覆盖查询与环境指纹，
# 正是全 Unicode 字体 fallback 需要的东西，不必在本仓库重造。
docx-layout = { path = "../docx-layout/crates/docx-layout" }
docx-layout-contract = { path = "../docx-layout/crates/docx-layout-contract" }
rsword-layout-core = { path = "crates/core" }
rsword-layout-gpu = { path = "crates/gpu" }
rsword-layout-svg = { path = "crates/svg" }
rsword-layout-wasm = { path = "crates/wasm" }
rsword-layout-cffi = { path = "crates/cffi" }
serde_json = "1"
# skrifa 只给字形轮廓，不做光栅化（它自己的依赖仅 bytemuck + core_maths）。
# zeno 是配套的 2D 路径光栅化器，OutlinePen 与它的 PathBuilder 天然对接。
skrifa = "=0.44.0"
zeno = "=0.3.3"
# HarfBuzz shaping 算法的纯 Rust 移植。选它而不是链接 libs/harfbuzz 的 C 库，
# 是因为 wasm 目标要能编译——纯 Rust 才走得通。
rustybuzz = "=0.20.1"

[workspace.lints.rust]
# cffi 要暴露 C ABI（extern "C" + 裸指针），与 forbid 不相容，所以整个 workspace 放开。
# 各 crate 内部仍应优先写安全代码：目前只有 cffi 的边界层与 wasm 的顶点上传需要 unsafe。
unsafe_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
