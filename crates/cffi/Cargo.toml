[package]
name = "rsword-layout-cffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# cdylib 给 C/C++ 动态链接；staticlib 给静态链接；rlib 让 Rust 侧（如 webgl）能直接引用。
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
# 真字体排版：`rsl_fonts_*` 与 `rsl_session_new_ex` 的字体集参数。
fontenv = ["rsword-layout-core/fontenv"]

[dependencies]
rsword-layout-core = { workspace = true }
rsword-layout-gpu = { workspace = true }
rsword = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
