[package]
name = "rsword-layout-cffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# cdylib 给 C/C++ 动态链接；staticlib 给静态链接；rlib 让 Rust 侧（如 webgl）能直接引用。
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
rsword-layout-core = { workspace = true, features = ["gpu"] }
rsword = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
