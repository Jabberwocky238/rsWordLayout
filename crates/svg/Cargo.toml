[package]
name = "rsword-layout-svg"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "render"
path = "bin/render.rs"

[features]
fontenv = ["rsword-layout-core/fontenv", "dep:skrifa"]

[dependencies]
rsword-layout-core = { workspace = true }
rsword = { workspace = true }
serde_json = { workspace = true }
skrifa = { workspace = true, optional = true }

[lints]
workspace = true
