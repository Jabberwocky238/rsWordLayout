[package]
name = "rsword-layout-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# bin/ 与 examples/ 不在 src/ 下，Cargo 不会自动发现。
[[bin]]
name = "render"
path = "bin/render.rs"

[[bin]]
name = "layout-trace"
path = "bin/layout-trace.rs"
# 真度量要读字体文件并整形，所以这个 bin 只在 shape 下构建。
required-features = ["shape"]

[[example]]
name = "dump"
path = "examples/dump.rs"

[[example]]
name = "probe_fontenv"
path = "examples/probe_fontenv.rs"

[[example]]
name = "probe_shape"
path = "examples/probe_shape.rs"
required-features = ["shape"]

[[test]]
name = "repr_c"
path = "tests/repr_c.rs"

[[test]]
name = "paint"
path = "tests/paint.rs"

[[test]]
name = "font_metrics"
path = "tests/font_metrics.rs"
required-features = ["shape"]


[features]
default = []
# rustybuzz 整形。产物是 glyph id 与 twips 推进量，与分辨率无关，故留在 core；
# 栅格化需要知道目标 DPI，归 rsword-layout-gpu。
shape = ["dep:rustybuzz", "dep:skrifa"]

[dependencies]
rsword = { workspace = true }
serde_json = { workspace = true }
docx-layout = { workspace = true }
docx-layout-contract = { workspace = true }
rustybuzz = { workspace = true, optional = true }
# 真度量要读 hhea/OS-2 的纵向量；skrifa 只解析表，不做光栅化。
skrifa = { workspace = true, optional = true }

[lints]
workspace = true
