[package]
name = "rsword-layout-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# bin/ 与 examples/ 不在 src/ 下，Cargo 不会自动发现。
[[bin]]
name = "render"
path = "bin/render.rs"

[[example]]
name = "dump"
path = "examples/dump.rs"

[[example]]
name = "probe_fontenv"
path = "examples/probe_fontenv.rs"

[[example]]
name = "probe_shape"
path = "examples/probe_shape.rs"
required-features = ["shape"]

[[example]]
name = "probe_raster"
path = "examples/probe_raster.rs"
required-features = ["raster"]

[[test]]
name = "repr_c"
path = "tests/repr_c.rs"

[[test]]
name = "atlas"
path = "tests/atlas.rs"
required-features = ["gpu"]

[features]
default = []
# 布局产物 → 顶点/索引缓冲 + 绘制批次。与图形 API 无关，三个后端共用。
gpu = []
# 用 skrifa 读轮廓 + zeno 光栅化的 Rasterizer 实现。
# 单独成 feature：不做 GPU 渲染的调用方（如 SVG 后端）不必带上这两个依赖。
raster = ["gpu", "dep:skrifa", "dep:zeno"]
# rustybuzz 实现的 Shaper：连字、阿拉伯语形态、印度语重排都靠它。
shape = ["gpu", "dep:rustybuzz"]

[dependencies]
rsword = { workspace = true }
serde_json = { workspace = true }
docx-layout = { workspace = true }
docx-layout-contract = { workspace = true }
skrifa = { workspace = true, optional = true }
zeno = { workspace = true, optional = true }
rustybuzz = { workspace = true, optional = true }

[lints]
workspace = true
