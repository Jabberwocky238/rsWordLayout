[package]
name = "rsword-layout-gpu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
# 栅格化实现已移入 core 的 `font` 模块；这里只是转发，
# 让依赖 gpu 的调用方不必单独声明 core 的特性。
raster = ["rsword-layout-core/raster"]

[[test]]
name = "atlas"
path = "tests/atlas.rs"

[dependencies]
rsword-layout-core = { workspace = true, features = ["raster"] }

[lints]
workspace = true
