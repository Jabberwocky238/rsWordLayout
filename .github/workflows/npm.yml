name: npm

# @jabberwocky238/rs-word-layout：wasm + wasm-bindgen JS 绑定，全部来自 crates/webgl（见其 README），
# 发布到 GitHub Packages（npm.pkg.github.com）。版本号取 crates/webgl/Cargo.toml；该版本在注册表上
# 还不存在时才构建并发布，已存在则整个作业跳过。改版本号 = 发版。
# 带 `-` 的预发布版本（0.2.0-rc.1）发到 dist-tag `next`，其余发到 `latest`。
#
# 发布用 workflow 自带的 GITHUB_TOKEN；另需仓库 secret
#   DOCX_LAYOUT_TOKEN  能读私有仓库 LilLeapo/docx-layout 的 token（contents: read）
#
# 根 Cargo.toml 以 `path = "../docx-layout/..."` 依赖 docx-layout，所以两个仓库并排检出到
# $GITHUB_WORKSPACE/rsWordLayout 与 $GITHUB_WORKSPACE/docx-layout。
on:
  push:
    # npm-publish：首发用的发布分支，合进 main 后可从这里删掉
    branches: [main, npm-publish]
  workflow_dispatch:
    inputs:
      docx_layout_ref:
        description: 'docx-layout 的 ref（默认用下方 env 钉住的提交）'
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: rsWordLayout

env:
  CARGO_TERM_COLOR: always
  # path 依赖没有版本锁；发布件用哪个 docx-layout 由这里钉住，升级时一并改。
  DOCX_LAYOUT_REF: 8e81e76bbfb307c186d9ec77a3bce6e54e586c6d

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: rsWordLayout
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@jabberwocky238'
      - name: Version gate
        id: gate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name=$(node -p "require('./crates/webgl/package.json').name")
          version=$(node crates/webgl/pack.mjs version)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$(npm view "$name@$version" version 2>/dev/null)" == "$version" ]]; then
            echo "::notice::$name@$version 已在注册表上，跳过"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          repository: LilLeapo/docx-layout
          ref: ${{ inputs.docx_layout_ref || env.DOCX_LAYOUT_REF }}
          token: ${{ secrets.DOCX_LAYOUT_TOKEN }}
          path: docx-layout
      - if: steps.gate.outputs.publish == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - if: steps.gate.outputs.publish == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rsWordLayout
          key: npm-wasm
      - name: Install matching wasm-bindgen
        if: steps.gate.outputs.publish == 'true'
        run: |
          version=$(python3 -c 'import tomllib; d = tomllib.load(open("Cargo.lock", "rb")); print(next(p["version"] for p in d["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build WASM
        if: steps.gate.outputs.publish == 'true'
        run: |
          cargo build -p rsword-layout-webgl --target wasm32-unknown-unknown --release --locked
          wasm-bindgen target/wasm32-unknown-unknown/release/rsword_layout_webgl.wasm \
            --out-dir crates/webgl/pkg --target web
      - name: Pack
        if: steps.gate.outputs.publish == 'true'
        run: node crates/webgl/pack.mjs pack
      - name: Publish
        if: steps.gate.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          tag=latest
          [[ "$VERSION" == *-* ]] && tag=next
          npm publish crates/webgl/pkg --tag "$tag"
